name: Midnight Compact Compilation Check
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Node.js v22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Compact Toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
        echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

    - name: Compile Compact Contract
      run: |
        echo "Starting Midnight Toolchain compilation..."
        compact compile contract.compact managed
        echo "Level 1 Requirement: Toolchain and compilation check completed"
